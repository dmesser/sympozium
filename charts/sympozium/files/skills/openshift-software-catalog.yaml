        resources: ["pods", "services", "configmaps", "secrets", "serviceaccounts", "persistentvolumeclaims"]
        verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
      - apiGroups: ["apps"]
        resources: ["deployments", "statefulsets", "replicasets"]
        verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
      - apiGroups: ["operators.coreos.com"]
        resources: ["clusterserviceversions", "catalogsources"]
        verbs: ["get", "list", "watch"]
      - apiGroups: ["operators.coreos.com"]
        resources: ["operatorgroups"]
        verbs: ["get", "list", "watch", "create", "delete"]
      - apiGroups: ["operators.coreos.com"]
        resources: ["subscriptions"]
        verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
      - apiGroups: ["operators.coreos.com"]
        resources: ["installplans"]
        verbs: ["get", "list", "watch", "update", "patch"]
      - apiGroups: ["packages.operators.coreos.com"]
        resources: ["packagemanifests"]
        verbs: ["get", "list", "watch"]
    clusterRBAC:
      - apiGroups: [""]
        resources: ["namespaces"]
        verbs: ["get", "list", "watch", "create"]
      - apiGroups: [""]
        resources: ["secrets"]
        verbs: ["get", "list", "watch"]
      - apiGroups: ["operators.coreos.com"]
        resources: ["clusterserviceversions", "catalogsources"]
        verbs: ["get", "list", "watch"]
      - apiGroups: ["operators.coreos.com"]
        resources: ["operatorgroups"]
        verbs: ["get", "list", "watch", "create", "delete"]
      - apiGroups: ["operators.coreos.com"]
        resources: ["subscriptions"]
        verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
      - apiGroups: ["operators.coreos.com"]
        resources: ["installplans"]
        verbs: ["get", "list", "watch", "update", "patch"]
      - apiGroups: ["packages.operators.coreos.com"]
        resources: ["packagemanifests"]
        verbs: ["get", "list", "watch"]
      - apiGroups: ["apiextensions.k8s.io"]
        resources: ["customresourcedefinitions"]
        verbs: ["get", "list", "watch"]
      - apiGroups: ["helm.openshift.io"]
