{{- if .Values.defaultSkills.enabled }}
{{- range $path, $_ := .Files.Glob "files/skills/*.yaml" }}
---
{{- $content := $.Files.Get $path }}
{{- $content = $content | replace "namespace: sympozium-system" (printf "namespace: %s" (include "sympozium.namespace" $)) }}
{{- $content = $content | replace "ghcr.io/sympozium-ai/sympozium/" (printf "%s/" $.Values.image.registry) }}
{{- $content = $content | replace ":latest" (printf ":%s" $.Values.image.tag) }}
{{- $content = trimPrefix "---" ($content | trimAll "\n ") }}
{{ $content }}
{{- end }}
{{- end }}
