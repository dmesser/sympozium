{{- if .Values.openshiftLightspeed.enabled }}
---
# ClusterRole granting the sympozium-agent ServiceAccount all permissions
# required by the OpenShift SkillPacks (observability, security, platform,
# software-catalog). Created statically because the Sympozium controller can
# only dynamically delegate permissions it already holds, and the default
# sympozium-manager ClusterRole does not include OpenShift-specific API groups.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: sympozium-openshift-agent
  labels:
    {{- include "sympozium.labels" . | nindent 4 }}
    sympozium.ai/component: agent-rbac
rules:
  # ── Core API (read) ─────────────────────────────────────────────────────
  - apiGroups: [""]
    resources:
      - nodes
      - pods
      - pods/log
      - services
      - endpoints
      - configmaps
      - secrets
      - events
      - persistentvolumes
      - persistentvolumeclaims
      - resourcequotas
      - limitranges
      - serviceaccounts
    verbs: ["get", "list", "watch"]
  # ── Core API (write — namespaces, resources for operator CR lifecycle) ──
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["get", "list", "watch", "create"]
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["get", "create"]
  - apiGroups: [""]
    resources: ["services", "configmaps", "secrets", "serviceaccounts", "persistentvolumeclaims"]
    verbs: ["create", "update", "patch", "delete"]

  # ── Apps (read + write for helm uninstall / remediation) ────────────────
  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets", "replicasets", "daemonsets"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]

  # ── Batch ─────────────────────────────────────────────────────────────────
  - apiGroups: ["batch"]
    resources: ["jobs", "cronjobs"]
    verbs: ["get", "list", "watch"]

  # ── RBAC (read + write for SCC rolebinding remediation) ─────────────────
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["clusterroles", "clusterrolebindings", "roles", "rolebindings"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]

  # ── Networking ────────────────────────────────────────────────────────────
  - apiGroups: ["networking.k8s.io"]
    resources: ["networkpolicies"]
    verbs: ["get", "list", "watch"]

  # ── OpenShift Config (clusterversion, clusteroperators, infrastructure) ──
  - apiGroups: ["config.openshift.io"]
    resources: ["*"]
    verbs: ["get", "list", "watch"]

  # ── OpenShift Operator ────────────────────────────────────────────────────
  - apiGroups: ["operator.openshift.io"]
    resources: ["*"]
    verbs: ["get", "list", "watch"]

  # ── OpenShift Projects ────────────────────────────────────────────────────
  - apiGroups: ["project.openshift.io"]
    resources: ["projects"]
    verbs: ["get", "list", "watch"]

  # ── OpenShift Machine API ─────────────────────────────────────────────────
  - apiGroups: ["machine.openshift.io"]
    resources: ["machines", "machinesets", "machinehealthchecks"]
    verbs: ["get", "list", "watch"]

  # ── OpenShift Machine Configuration ──────────────────────────────────────
  - apiGroups: ["machineconfiguration.openshift.io"]
    resources: ["machineconfigpools", "machineconfigs"]
    verbs: ["get", "list", "watch"]

  # ── OpenShift Security Context Constraints ────────────────────────────────
  - apiGroups: ["security.openshift.io"]
    resources: ["securitycontextconstraints"]
    verbs: ["get", "list", "watch", "use"]

  # ── OLM Operators & Package Manifests ─────────────────────────────────────
  - apiGroups: ["operators.coreos.com"]
    resources: ["clusterserviceversions", "catalogsources"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["operators.coreos.com"]
    resources: ["operatorgroups"]
    verbs: ["get", "list", "watch", "create", "delete"]
  - apiGroups: ["operators.coreos.com"]
    resources: ["subscriptions"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["operators.coreos.com"]
    resources: ["installplans"]
    verbs: ["get", "list", "watch", "update", "patch"]
  - apiGroups: ["packages.operators.coreos.com"]
    resources: ["packagemanifests"]
    verbs: ["get", "list", "watch"]

  # ── CRD discovery (needed to inspect operator-provided APIs) ────────────
  - apiGroups: ["apiextensions.k8s.io"]
    resources: ["customresourcedefinitions"]
    verbs: ["get", "list", "watch"]

  # ── Operator-managed custom resources (wildcard for demo flexibility) ───
  # The agent deploys CRs whose API groups are only known at runtime
  # (e.g. app.redislabs.com, redis.redis.opstreelabs.in). A targeted
  # wildcard on verbs keeps this safe behind HITL approval.
  - apiGroups: ["app.redislabs.com"]
    resources: ["*"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["redis.redis.opstreelabs.in"]
    resources: ["*"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]

  # ── Helm Chart Repositories ──────────────────────────────────────────────
  - apiGroups: ["helm.openshift.io"]
    resources: ["helmchartrepositories"]
    verbs: ["get", "list", "watch"]

  # ── Prometheus / Monitoring ──────────────────────────────────────────────
  - apiGroups: ["monitoring.coreos.com"]
    resources: ["prometheuses", "alertmanagers", "servicemonitors", "prometheusrules"]
    verbs: ["get", "list", "watch"]

  # ── Metrics (oc adm top) ─────────────────────────────────────────────────
  - apiGroups: ["metrics.k8s.io"]
    resources: ["pods", "nodes"]
    verbs: ["get", "list"]

  # ── ACS / StackRox ─────────────────────────────────────────────────────
  - apiGroups: ["platform.stackrox.io"]
    resources: ["centrals", "securedclusters"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["config.stackrox.io"]
    resources: ["securitypolicies"]
    verbs: ["get", "list", "watch"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: sympozium-openshift-agent
  labels:
    {{- include "sympozium.labels" . | nindent 4 }}
    sympozium.ai/component: agent-rbac
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: sympozium-openshift-agent
subjects:
  - kind: ServiceAccount
    name: sympozium-agent
    namespace: {{ include "sympozium.namespace" . }}
{{- end }}
